version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmmonitor
      POSTGRES_PASSWORD: llmmonitor
      POSTGRES_DB: llmmonitor
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llmmonitor:llmmonitor@postgres:5432/llmmonitor
      PORT: "3001"
      NODE_ENV: production
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llmmonitor:llmmonitor@postgres:5432/llmmonitor
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
